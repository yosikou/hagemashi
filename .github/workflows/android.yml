name: Android debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-page:
    name: Privacy page mobile layout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all policy translations and offline structure
        run: python3 scripts/check-privacy-page.py
      - name: Install CI-only browser and fonts
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-core
      - name: Check mobile layouts, language links and no-script fallback
        run: python3 scripts/check-privacy-browser.py
      - name: Upload local preview (does not deploy Pages)
        uses: actions/upload-artifact@v4
        with:
          name: privacy-page-preview
          path: |
            docs/privacy.html
            build/privacy-preview/*.png
          retention-days: 14

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform and build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v5
      - name: Restore stable signing key
        id: signing
        env:
          SIGNING_BUNDLE: ${{ secrets.HAGEMASHI_SIGNING_BUNDLE }}
        run: python3 .github/scripts/restore-signing.py
      - name: Test signing secret handling
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Check production translations
        run: python3 scripts/check-localizations.py
      - name: Check static privacy policy
        run: python3 scripts/check-privacy-page.py
      - name: Test, lint and build app and UI test APKs
        env:
          HAGEMASHI_BUILD_ID: ${{ github.sha }}.${{ github.run_id }}.${{ github.run_attempt }}
        run: ./gradlew --no-daemon --no-configuration-cache :app:testDebugUnitTest :app:testDiagnosticUnitTest :app:lintDebug :app:lintDiagnostic :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleDiagnostic
      - name: Check whitespace
        run: git diff --check HEAD^
      - name: Verify stable signatures and APK manifests
        if: steps.signing.outputs.available == 'true'
        run: python3 .github/scripts/verify-apks.py
      - name: Upload debug APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hagemashi-debug-apk
          overwrite: true
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostic APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hagemashi-diagnostic-apk
          overwrite: true
          path: app/build/outputs/apk/diagnostic/app-diagnostic.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hagemashi-check-reports
          overwrite: true
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDiagnosticUnitTest/
            app/build/test-results/testDiagnosticUnitTest/
            app/build/reports/lint-results-diagnostic.html
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/hagemashi-signing.p12"

  release-inspection:
    name: Release ad configuration (${{ matrix.ads }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ads: [off, test, production]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platforms
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build unsigned release for static inspection only
        run: ./gradlew --no-daemon --no-configuration-cache :app:lintRelease :app:assembleRelease :app:bundleRelease -Phagemashi.releaseAds=${{ matrix.ads }}
      - name: Inspect APK and AAB (no install, no ad request)
        run: python3 .github/scripts/ad-artifact.py --mode ${{ matrix.ads }} --apk app/build/outputs/apk/release/app-release-unsigned.apk --aab app/build/outputs/bundle/release/app-release.aab --report ad-config-verification.json
      - name: Prove release production flag cannot change developer APK IDs
        if: matrix.ads == 'production'
        run: |
          ./gradlew --no-daemon --no-configuration-cache :app:assembleDebug :app:assembleDiagnostic -Phagemashi.releaseAds=production
          python3 .github/scripts/ad-artifact.py --mode test --apk app/build/outputs/apk/debug/app-debug.apk
          python3 .github/scripts/ad-artifact.py --mode test --apk app/build/outputs/apk/diagnostic/app-diagnostic.apk
      - name: Upload inspection artifacts (unsigned; do not install)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.ads }}-static-inspection
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/bundle/release/app-release.aab
            ad-config-verification.json
          if-no-files-found: error
          retention-days: 14
