name: Store phone screenshots

on:
  push:
    branches: [assets/store-phone-screenshots]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"'
      - uses: gradle/actions/setup-gradle@v5
      - name: Required checks and screenshot test compilation
        run: ./gradlew --no-daemon :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM on disposable runner
        run: sudo chmod 666 /dev/kvm
      - name: Run real app and capture fictional phone screens
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/capture-store-phone.sh
      - name: Upload phone PNGs (fictional data only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hagemashi-store-phone-screenshots
          path: dist/store-phone/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload capture reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-phone-capture-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
